<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mundo dos Números</title>
  <meta name="description" content="Matemática divertida para o 1º ano do Ensino Fundamental: mais de 1.600 questões para crianças de 6 e 7 anos.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <a class="marca" href="index.html" aria-label="Início">
      <span class="mascote" aria-hidden="true">🦉</span>
      <span><h1>Mundo dos Números</h1><small>Matemática • 1º ano</small></span>
    </a>
    <div class="estrelas-total" id="estrelasTotal" title="Estrelas conquistadas">⭐ 0</div>
  </header>

  <main>
    <!-- ===================== INÍCIO ===================== -->
    <section id="telaInicio">
      <div class="ola">
        <div class="balao">
          <h2 id="saudacao">Olá! Eu sou a Corujinha Conta! 🦉</h2>
          <p>Escolha um assunto e responda 10 perguntas. Cada acerto vale uma estrela ⭐</p>
        </div>
        <div class="nome-campo">
          <label for="nome" style="font-weight:800">Seu nome:</label>
          <input id="nome" maxlength="20" placeholder="Digite aqui" autocomplete="off">
        </div>
      </div>

      <h3 class="secao-titulo">1. Escolha o nível</h3>
      <div class="niveis" role="group" aria-label="Nível">
        <button class="nivel" data-nivel="0" aria-pressed="true">🎲 Misturado</button>
        <button class="nivel" data-nivel="1" aria-pressed="false">🌱 Fácil</button>
        <button class="nivel" data-nivel="2" aria-pressed="false">🌿 Médio</button>
        <button class="nivel" data-nivel="3" aria-pressed="false">🌳 Desafio</button>
      </div>

      <h3 class="secao-titulo">2. Escolha o assunto</h3>
      <div class="temas" id="listaTemas"></div>
      <button class="botao misturar" id="btnMisturar">🌈 Misturar todos os assuntos</button>
    </section>

    <!-- ===================== QUESTÃO ===================== -->
    <section id="telaQuiz" class="oculto">
      <div class="quiz-topo">
        <button class="botao secundario" id="btnSair" aria-label="Voltar ao início">⬅ Sair</button>
        <div class="titulo" id="quizTitulo"></div>
        <div class="bolinhas" id="bolinhas" aria-label="Progresso"></div>
      </div>

      <article class="cartao" id="cartao">
        <div class="etiquetas" id="etiquetas"></div>
        <div class="enunciado-linha">
          <h2 class="enunciado" id="enunciado"></h2>
          <button class="ouvir" id="btnOuvir" title="Ouvir a pergunta" aria-label="Ouvir a pergunta">🔊</button>
        </div>
        <div class="visual oculto" id="visual"></div>
        <div class="relogio oculto" id="relogio"></div>

        <div id="areaResposta"></div>

        <div class="caixa-dica oculto" id="caixaDica"></div>
        <div class="retorno oculto" id="retorno" role="status" aria-live="polite"></div>

        <div class="acoes">
          <button class="botao dica" id="btnDica">💡 Dica</button>
          <button class="botao verde" id="btnConferir">✔ Conferir</button>
          <button class="botao oculto" id="btnProxima">Próxima ➜</button>
        </div>
      </article>
    </section>

    <!-- ===================== RESULTADO ===================== -->
    <section id="telaResultado" class="oculto">
      <article class="cartao resultado">
        <div class="grande" id="resEmoji">🏆</div>
        <h2 id="resTitulo"></h2>
        <p id="resTexto" style="font-weight:700;font-size:20px"></p>
        <div class="grande" id="resEstrelas" style="font-size:44px"></div>
        <div class="acoes">
          <button class="botao" id="btnDeNovo">🔄 Jogar de novo</button>
          <button class="botao secundario" id="btnInicio">🏠 Escolher outro assunto</button>
        </div>
        <div class="revisao oculto" id="revisao"></div>
      </article>
    </section>
  </main>

  <footer class="rodape">
    Feito com carinho para pequenos matemáticos • <a href="professor.html">Área do professor e da família</a>
  </footer>

  <script src="js/questoes.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
